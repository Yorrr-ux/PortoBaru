<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Details | Yorianmar Rahagi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'] },
            colors: { ink: '#09090b', card: '#121215', line: '#27272a', snow: '#fafafa', mute: '#a1a1aa' },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        background: #09090b;
      }
      body {
        background: #09090b;
        color: #fafafa;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: #fafafa;
        color: #09090b;
      }
      .glass {
        background: rgba(18, 18, 21, 0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid #27272a;
      }
      .hair {
        border: 1px solid #27272a;
      }
      .thumb-ph {
        background:
          linear-gradient(#27272a 1px, transparent 1px) 0 0 / 24px 24px,
          linear-gradient(90deg, #27272a 1px, transparent 1px) 0 0 / 24px 24px,
          radial-gradient(circle at 30% 20%, #1c1c20, #0c0c0e 70%);
      }
      .card-w {
        transition:
          border-color 0.35s,
          transform 0.35s;
      }
      .card-w:hover {
        border-color: #52525b;
        transform: translateY(-3px);
      }
      .card-w:hover .thumb img {
        transform: scale(1.04);
      }
      .thumb img {
        transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      #modal {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #modal.open {
        opacity: 1;
        pointer-events: auto;
      }
      #modal .panel {
        transform: translateY(16px) scale(0.98);
        transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      #modal.open .panel {
        transform: none;
      }
    </style>
  </head>
  <body class="font-sans">
    <!-- NAV -->
    <header class="fixed top-0 inset-x-0 z-40">
      <nav class="glass mx-auto mt-4 flex max-w-6xl items-center justify-between rounded-full px-6 py-3 w-[calc(100%-2rem)]">
        <a href="index.html" class="text-lg font-extrabold tracking-tight">Yorr.</a>
        <a href="index.html#work" class="inline-flex items-center gap-2 text-sm text-mute transition hover:text-snow"> <span aria-hidden="true">←</span> Back to Projects </a>
      </nav>
    </header>

    <main id="project-container" class="mx-auto max-w-6xl px-6 pb-28 pt-32"></main>

    <!-- MODAL 3D VIEWER -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" data-close></div>
      <div class="panel glass relative w-full max-w-2xl overflow-hidden rounded-2xl bg-card">
        <button data-close id="m-close" aria-label="Close details" class="absolute right-4 top-4 z-10 grid h-9 w-9 place-items-center rounded-full bg-ink/70 hair text-lg transition hover:border-snow">&times;</button>
        <div id="m-thumb" class="thumb relative aspect-[16/9] w-full overflow-hidden border-b border-line"></div>
        <div class="p-7">
          <p class="text-xs text-mute">3D Asset</p>
          <h3 id="m-title" class="mt-1 text-2xl font-bold tracking-tight"></h3>
          <p id="m-desc" class="mt-4 leading-relaxed text-mute"></p>
          <ul id="m-tags" class="mt-6 flex flex-wrap gap-2"></ul>
        </div>
      </div>
    </div>

    <footer class="border-t border-line">
      <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 px-6 py-8 text-sm text-mute sm:flex-row">
        <span class="font-extrabold text-snow">Yorr.</span>
        <span>© 2026 Yorianmar Rahagi.</span>
        <a class="transition hover:text-snow" href="index.html#work">All Projects</a>
      </div>
    </footer>

    <script src="projects-data.js"></script>
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const params = new URLSearchParams(window.location.search);
      const gameId = params.get('id');
      const game = gamesData.find((g) => g.id === gameId);
      const container = $('#project-container');

      const thumb = (item) =>
        item.img
          ? `<img src="${item.img}" alt="${item.title}" class="absolute inset-0 h-full w-full object-cover">`
          : `<div class="thumb-ph absolute inset-0 grid place-items-center"><span class="hair rounded-full bg-ink/70 px-4 py-1.5 text-xs text-mute">${item.title}</span></div>`;

      if (!game) {
        container.innerHTML = `
          <div class="py-20 text-center">
            <h1 class="text-3xl font-bold">Project not found</h1>
            <p class="mt-3 text-mute">The game project you are looking for does not exist.</p>
            <a href="index.html#work" class="mt-6 inline-block rounded-full bg-snow px-6 py-3 text-sm font-semibold text-ink">Back to Home</a>
          </div>`;
      } else {
        document.title = `${game.title} | Yorianmar Rahagi`;

        container.innerHTML = `
          <!-- BAGIAN 1: OVERVIEW & PENJELASAN PROJECT -->
          <div class="grid gap-10 lg:grid-cols-[1.15fr_1fr] lg:items-center">
            <div class="thumb relative aspect-[16/9] overflow-hidden rounded-2xl hair bg-card">
              ${thumb(game)}
            </div>
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="rounded-full glass px-3.5 py-1 text-xs text-mute">Game Project</span>
                <span class="rounded-full hair px-3.5 py-1 text-xs text-snow">${game.role}</span>
              </div>
              <h1 class="mt-4 text-3xl font-extrabold tracking-tight sm:text-5xl">${game.title}</h1>
              <p class="mt-4 text-base leading-relaxed text-mute">${game.desc}</p>
              
              <ul class="mt-6 flex flex-wrap gap-2">
                ${game.tags.map((t) => `<li class="hair rounded-full px-3 py-1 text-xs text-mute">${t}</li>`).join('')}
              </ul>

              ${
                game.itch
                  ? `<div class="mt-8">
                      <a href="${game.itch}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 rounded-full bg-snow px-6 py-3 text-sm font-semibold text-ink transition hover:bg-mute">
                        Play on itch.io <span aria-hidden="true">↗</span>
                      </a>
                    </div>`
                  : ''
              }
            </div>
          </div>

          <!-- BAGIAN 2: APA SAJA YANG SAYA KERJAKAN (CONTRIBUTIONS) -->
          <section class="mt-16 rounded-2xl hair bg-card p-7 sm:p-10">
            <p class="text-xs uppercase tracking-wider text-mute">Role &amp; Responsibilities</p>
            <h2 class="mt-1 text-2xl font-bold tracking-tight">What I Worked On</h2>
            <ul class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              ${game.contributions
                .map(
                  (item, idx) => `
                <li class="rounded-xl border border-line bg-ink/60 p-5">
                  <span class="text-xs font-bold text-mute">0${idx + 1}</span>
                  <p class="mt-2 text-sm leading-relaxed text-snow/90">${item}</p>
                </li>`,
                )
                .join('')}
            </ul>
          </section>

          <!-- BAGIAN 3: 3D ASSETS YANG DIKERJAKAN DI GAME INI -->
          <section class="mt-20 border-t border-line pt-16">
            <div class="flex flex-col justify-between gap-2 sm:flex-row sm:items-end">
              <div>
                <p class="text-xs uppercase tracking-wider text-mute">3D Showcase</p>
                <h2 class="mt-1 text-2xl font-bold tracking-tight sm:text-3xl">3D Assets Created for ${game.title}</h2>
              </div>
              <p class="text-sm text-mute">${game.assets.length} asset${game.assets.length > 1 ? 's' : ''}</p>
            </div>

            ${
              game.assets.length > 0
                ? `<div id="asset-grid" class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                    ${game.assets
                      .map(
                        (a, idx) => `
                      <article class="card-w hair overflow-hidden rounded-2xl bg-card">
                        <div class="thumb relative aspect-[4/3] overflow-hidden border-b border-line">${thumb(a)}</div>
                        <div class="p-6">
                          <p class="text-xs text-mute">3D Asset</p>
                          <h3 class="mt-1 text-lg font-semibold">${a.title}</h3>
                          <p class="mt-2 text-sm leading-relaxed text-mute">${a.summary}</p>
                          <button data-asset-idx="${idx}" class="hair mt-5 rounded-full px-4 py-2 text-sm font-medium transition hover:border-snow hover:bg-snow hover:text-ink">
                            Inspect 3D Model
                          </button>
                        </div>
                      </article>`,
                      )
                      .join('')}
                  </div>`
                : `<p class="mt-8 rounded-2xl hair bg-card p-8 text-center text-sm text-mute">3D assets for this project will be uploaded soon.</p>`
            }
          </section>
        `;

        // Modal Logic untuk Inspect 3D Asset (.glb)
        const modal = $('#modal');
        const assetGrid = $('#asset-grid');
        if (assetGrid) {
          assetGrid.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-asset-idx]');
            if (!btn) return;
            const asset = game.assets[+btn.dataset.assetIdx];
            if (!asset) return;

            if (asset.glb) {
              $('#m-thumb').innerHTML = `
                <model-viewer
                  src="${asset.glb}"
                  alt="${asset.title}"
                  camera-controls
                  auto-rotate
                  shadow-intensity="1"
                  touch-action="pan-y"
                  class="h-full w-full bg-[#0c0c0e]">
                </model-viewer>`;
            } else {
              $('#m-thumb').innerHTML = thumb(asset);
            }
            $('#m-title').textContent = asset.title;
            $('#m-desc').textContent = asset.desc;
            $('#m-tags').innerHTML = asset.tags.map((t) => `<li class="hair rounded-full px-3 py-1 text-xs text-mute">${t}</li>`).join('');

            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
          });
        }

        function closeModal() {
          modal.classList.remove('open');
          document.body.style.overflow = '';
          $('#m-thumb').innerHTML = '';
        }
        modal.addEventListener('click', (e) => {
          if (e.target.closest('[data-close]')) closeModal();
        });
        addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
        });
      }
    </script>
  </body>
</html>
